name: Remote Sync (Passwall 1)

on:
  workflow_dispatch:
  schedule:
      - cron: '0 0 * * 0,1,5'

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Target Repository
      uses: actions/checkout@v4
      with:
        # آدرس مخزنی که میخواهید آپدیت شود
        repository: peditx/openwrt-passwall
        token: ${{ secrets.GH_TOKEN }}
        fetch-depth: 0

    - name: Set Git user
      run: |
        git config --global user.name "peditx"
        git config --global user.email "pedram.ale@me.com"

    - name: Sync with Upstream
      run: |
        echo "Adding upstream remote..."
        git remote add upstream https://github.com/Openwrt-Passwall/openwrt-passwall.git || echo "Upstream already added."
        
        echo "Fetching from upstream..."
        git fetch upstream --tags

        echo "Resetting to upstream main..."
        git checkout main || git checkout -b main
        git reset --hard upstream/main

        echo "Updating tags..."
        LATEST_COMMIT=$(git rev-parse HEAD)
        for TAG in $(git tag); do
          git tag -d "$TAG" || true
          git tag -a "$TAG" -m "Reattached tag" "$LATEST_COMMIT"
        done

    - name: Inject Status File
      run: |
        TARGET_DIR="luci-app-passwall/luasrc/view/passwall/global"
        mkdir -p "$TARGET_DIR"
        
        curl -fSL -o "$TARGET_DIR/status.htm" \
          https://raw.githubusercontent.com/peditx/peditx-official-site/refs/heads/main/public/projects/passwall/Passwall1/status.htm
        
        ls -l "$TARGET_DIR/status.htm"

    - name: Commit and Push to Remote Repo
      run: |
        # تنظیم آدرس Push به مخزن مقصد در اکانت peditx
        git remote set-url origin https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/peditx/openwrt-passwall.git
        git add .
        if git diff-index --quiet HEAD; then
          echo "No changes to commit."
        else
          git commit -m "Remote Sync: Update status.htm and sync with upstream"
          git push origin main --force
        fi
