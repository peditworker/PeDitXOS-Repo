name: Remote Sync (Passwall 1)

on:
  workflow_dispatch:
  schedule:
      - cron: '0 0 * * 0,1,5'

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Target Repository
      uses: actions/checkout@v4
      with:
        # مخزن مقصد جدید شما
        repository: peditworker/PeDitXOS_Passwall
        token: ${{ secrets.GH_TOKEN }}
        fetch-depth: 0

    - name: Fix Safe Directory
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Set Git user
      run: |
        git config --global user.name "peditworker"
        git config --global user.email "pedram.ale@me.com"

    - name: Sync with Upstream
      run: |
        echo "Adding upstream remote..."
        git remote add upstream https://github.com/Openwrt-Passwall/openwrt-passwall.git || echo "Upstream already added."
        
        echo "Fetching from upstream..."
        git fetch upstream --tags

        # چک کردن شاخه اصلی (main یا master)
        git checkout main || git checkout master || git checkout -b main

        echo "Resetting to upstream..."
        git reset --hard upstream/main || git reset --hard upstream/master

        echo "Updating tags..."
        LATEST_COMMIT=$(git rev-parse HEAD)
        for TAG in $(git tag); do
          git tag -d "$TAG" || true
          git tag -a "$TAG" -m "Reattached tag" "$LATEST_COMMIT"
        done

    - name: Inject Status File
      run: |
        TARGET_DIR="luci-app-passwall/luasrc/view/passwall/global"
        mkdir -p "$TARGET_DIR"
        
        echo "Downloading status.htm for Passwall 1..."
        curl -fSL -o "$TARGET_DIR/status.htm" \
          https://raw.githubusercontent.com/peditx/peditx-official-site/refs/heads/main/public/projects/passwall/Passwall1/status.htm
        
        ls -l "$TARGET_DIR/status.htm"

    - name: Commit and Push to Remote Repo
      run: |
        # تنظیم آدرس Push به مخزن جدید در اکانت peditworker
        git remote set-url origin "https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/peditworker/PeDitXOS_Passwall.git"
        
        git add .
        if git diff-index --quiet HEAD; then
          echo "No changes to commit."
        else
          git commit -m "Remote Sync: Update status.htm and sync with upstream (Passwall 1)"
          # تلاش برای Push به شاخه صحیح
          git push origin main --force || git push origin master --force
        fi
