name: Sync with Upstream (Passwall 1)

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
      - cron: '0 0 * * 0,1,5'

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GH_TOKEN }}
        fetch-depth: 0

    - name: Set Git user
      run: |
        git config --global user.name "peditx"
        git config --global user.email "pedram.ale@me.com"

    - name: Sync with Upstream (Openwrt-Passwall/openwrt-passwall)
      run: |
        echo "Adding upstream remote repository..."
        git remote add upstream https://github.com/Openwrt-Passwall/openwrt-passwall.git || echo "Upstream already added."
        
        echo "Fetching all changes including tags from upstream..."
        git fetch upstream --tags

        echo "Resetting local branch to match upstream/main (force reset)..."
        git checkout main
        git reset --hard upstream/main || echo "Failed to reset branch."

        echo "Ensuring branch is up-to-date (force rebase)..."
        git pull upstream main --rebase --allow-unrelated-histories || echo "Rebase failed."

        echo "Reattaching tags to the latest commit on main..."
        LATEST_COMMIT=$(git rev-parse HEAD)
        for TAG in $(git tag); do
          echo "Reattaching tag: $TAG"
          git tag -d "$TAG" || echo "Tag $TAG not found locally."
          git tag -a "$TAG" -m "Reattached tag to main" "$LATEST_COMMIT"
        done

    - name: Force Replace File
      run: |
        echo "Creating directory structure..."
        mkdir -p luci-app-passwall/luasrc/view/passwall/global/
        
        echo "Removing old status.htm file..."
        rm -f luci-app-passwall/luasrc/view/passwall/global/status.htm || echo "File does not exist."
        
        echo "Downloading new status.htm file from official site (Passwall 1)..."
        curl -fSL -o luci-app-passwall/luasrc/view/passwall/global/status.htm \
          https://raw.githubusercontent.com/peditx/peditx-official-site/refs/heads/main/public/projects/passwall/Passwall1/status.htm
        
        echo "Verifying download..."
        ls -l luci-app-passwall/luasrc/view/passwall/global/status.htm

    - name: Commit and Push changes
      run: |
        echo "Committing and pushing changes to peditx/openwrt-passwall..."
        git remote set-url origin https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git
        git add luci-app-passwall/luasrc/view/passwall/global/status.htm
        git commit -m "Update status.htm from official site source and sync with Openwrt-Passwall upstream" || echo "No changes to commit"
        git push origin main --force || echo "Push failed."
